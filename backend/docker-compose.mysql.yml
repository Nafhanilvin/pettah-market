version: '3.9'
services:
  mysql:
    image: mysql:8.4
    container_name: pettah-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pettah_market
      MYSQL_USER: pettah_user
      MYSQL_PASSWORD: pettah_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
